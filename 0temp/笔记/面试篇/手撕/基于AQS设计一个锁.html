pan class="hljs-keyword">public</span> <span class="hljs-title function_">Yb0os1Lock</span><span class="hljs-params">(<span class="hljs-type">boolean</span> isFair)</span> &#123;<span class="hljs-comment">//可以传递是否 公平锁</span><br>        <span class="hljs-built_in">this</span>.isFair = isFair;<br>    &#125;<br><br>    <span class="hljs-keyword">public</span> <span class="hljs-keyword">void</span> <span class="hljs-title function_">lock</span><span class="hljs-params">()</span> &#123;<br>        <span class="hljs-keyword">if</span> (!isFair&amp;&amp; state.get() == <span class="hljs-number">0</span>) &#123;<span class="hljs-comment">//没有加锁 可以 直接获取锁</span><br>            <span class="hljs-keyword">if</span> (state.compareAndSet(<span class="hljs-number">0</span>, <span class="hljs-number">1</span>)) &#123;<br>                <span class="hljs-built_in">this</span>.owner = Thread.currentThread();<br>                System.out.println(<span class="hljs-string">&quot;线程&quot;</span> + owner.getName() + <span class="hljs-string">&quot;直接拿到获取锁&quot;</span>);<br>                <span class="hljs-keyword">return</span>;<br>            &#125;<br>        &#125; <span class="hljs-keyword">else</span> &#123;<span class="hljs-comment">//尝试冲入</span><br>            <span class="hljs-keyword">if</span> (owner == Thread.currentThread()) &#123;<br>                System.out.println(<span class="hljs-string">&quot;线程&quot;</span> + owner.getName() + <span class="hljs-string">&quot;重入次数为：&quot;</span> + state.incrementAndGet());<br>                <span class="hljs-keyword">return</span>;<br>            &#125;<br>        &#125;<br>        <span class="hljs-comment">//下面就是公平锁逻辑和非公平没有抢到锁的线程的逻辑</span><br>        <span class="hljs-comment">//没有抢到锁的以及公平锁，需要加入等待队列  下面的代码可能会出现线程安全问题 要格外的注意</span><br>        <span class="hljs-type">Node</span> <span class="hljs-variable">current</span> <span class="hljs-operator">=</span> <span class="hljs-keyword">new</span> <span class="hljs-title class_">Node</span>(Thread.currentThread());<br>        <span class="hljs-comment">//h --&gt; A</span><br>        <span class="hljs-comment">//如果线程1和线程2 同时获取currentTail为A，线程1修改尾节点成功，变成 h --&gt; A --&gt; B</span><br>        <span class="hljs-comment">//此时线程2继续修改，(A,C)肯定是失败的，那么重新回去尾节点 ，然后尝试修改 变为 h --&gt; A --&gt; B --&gt; C</span><br>        <span class="hljs-keyword">while</span> (<span class="hljs-literal">true</span>) &#123;<br>            <span class="hljs-type">Node</span> <span class="hljs-variable">currentTail</span> <span class="hljs-operator">=</span> tail.get();<br>            <span class="hljs-keyword">if</span> (tail.compareAndSet(currentTail, current)) &#123;<span class="hljs-comment">//这里对尾节点修改成功的只可能有一个线程 所以if里面是线程安全的</span><br>                System.out.println(<span class="hljs-string">&quot;线程&quot;</span> + current.thread.getName() + <span class="hljs-string">&quot;加入链表尾&quot;</span>);<br>                currentTail.next = current;<br>                current.prev = currentTail;<br>                <span class="hljs-keyword">break</span>;<br>            &#125;<br>        &#125;<br>        <span class="hljs-comment">//下面要阻塞等待 但是不能直接LockSupport.park() 因为存在虚假唤醒，所以需要一些条件才能返回</span><br>        <span class="hljs-comment">// 所满足的条件 当前节点是head的下一个 并且 可以获取锁</span><br>        <span class="hljs-keyword">while</span> (<span class="hljs-literal">true</span>) &#123;<br>            <span class="hljs-comment">//需要先自己尝试唤醒 然后再阻塞等待 在公平锁的场景下如果直接阻塞等待 就一直阻塞等待唤醒了</span><br>            <span class="hljs-comment">// 还有一种情况 两个线程1 2  1先抢到锁 2加到链表中但是此时还没有将链表和head连接起来 线程1就释放锁但是next==null 那么线程2就一直阻塞了</span><br>            <span class="hljs-comment">// LockSupport.park();</span><br>            <span class="hljs-keyword">if</span> (current.prev == head.get() &amp;&amp; state.compareAndSet(<span class="hljs-number">0</span>, <span class="hljs-number">1</span>)) &#123;<span class="hljs-comment">//里面是线程安全的</span><br>                <span class="hljs-comment">//需要将head后移</span><br>                current.prev.next = <span class="hljs-literal">null</span>;<br>                current.prev = <span class="hljs-literal">null</span>;<br>                <span class="hljs-built_in">this</span>.owner = Thread.currentThread();<br>                System.out.println(<span class="hljs-string">&quot;线程&quot;</span> + owner.getName() + <span class="hljs-string">&quot;被唤醒后拿到锁&quot;</span>);<br>                head.set(current);<span class="hljs-comment">//可以直接set不适用CAS 因为获取锁成功了 一定是线程安全的</span><br>                <span class="hljs-keyword">return</span>;<br>            &#125;<br>            LockSupport.park();<br>        &#125;<br>    &#125;<br><br>    <span class="hljs-keyword">public</span> <span class="hljs-keyword">void</span> <span class="hljs-title function_">unlock</span><span class="hljs-params">()</span> &#123;<br>        <span class="hljs-comment">//解锁判断 首先是判断是否是当前线程的锁</span><br>        <span class="hljs-keyword">if</span> (Thread.currentThread() != owner) &#123;<br>            <span class="hljs-keyword">throw</span> <span class="hljs-keyword">new</span> <span class="hljs-title class_">IllegalStateException</span>(<span class="hljs-string">&quot;当前线程不是锁的拥有者,不可以解锁&quot;</span>);<br>        &#125;<br>        <span class="hljs-type">int</span> <span class="hljs-variable">count</span> <span class="hljs-operator">=</span> state.get();<br>        <span class="hljs-keyword">if</span>(count&gt;<span class="hljs-number">1</span>)&#123;<br>            state.set(count-<span class="hljs-number">1</span>);<br>            System.out.println( <span class="hljs-string">&quot;线程&quot;</span> + owner.getName() + <span class="hljs-string">&quot;减少一次重入次数：&quot;</span> + state.get());<br>            <span class="hljs-keyword">return</span>;<br>        &#125;<br>        <span class="hljs-keyword">if</span> (count&lt;=<span class="hljs-number">0</span>)&#123;<br>            <span class="hljs-keyword">throw</span> <span class="hljs-keyword">new</span> <span class="hljs-title class_">IllegalStateException</span>(<span class="hljs-string">&quot;重入锁解锁错误！&quot;</span>);<br>        &#125;<br>        <span class="hljs-comment">//count==1</span><br>        <span class="hljs-comment">//还需要唤醒等待队列中head.next这个线程</span><br>        <span class="hljs-type">Node</span> <span class="hljs-variable">next</span> <span class="hljs-operator">=</span> head.get().next;<br>        <span class="hljs-comment">//owner是当前线程，可以解锁  并且一定是线程安全的</span><br>        <span class="hljs-built_in">this</span>.owner = <span class="hljs-literal">null</span>;<span class="hljs-comment">//不把 owner 置 null，会在以下情况出问题：线程A解了锁，然后线程B秒抢锁，但还没来得及把 owner 改成B，就被 A 重入了，然后B才执行 owner = B；这时候 A，B 都有锁，A执行 unlock 的时候才发现锁是B的，就抛异常了</span><br>        state.set(<span class="hljs-number">0</span>);<span class="hljs-comment">//释放锁之后保证不了线程安全了</span><br>        <span class="hljs-keyword">if</span> (next != <span class="hljs-literal">null</span>) &#123;<br>            System.out.println(<span class="hljs-string">&quot;线程&quot;</span> + Thread.currentThread().getName() + <span class="hljs-string">&quot;唤醒了线程&quot;</span> + next.thread.getName());<br>            LockSupport.unpark(next.thread);<br>        &#125;<br>    &#125;<br><br><br>    <span class="hljs-keyword">private</span> <span class="hljs-keyword">class</span> <span class="hljs-title class_">Node</span> &#123;<br>        Node next;<br>        Node prev;<br>        Thread thread;<br><br>        <span class="hljs-keyword">public</span> <span class="hljs-title function_">Node</span><span class="hljs-params">()</span> &#123;<br>        &#125;<br><br>        <span class="hljs-keyword">public</span> <span class="hljs-title function_">Node</span><span class="hljs-params">(Thread thread)</span> &#123;<br>            <span class="hljs-built_in">this</span>.thread = thread;<br>        &#125;<br>    &#125;<br>&#125;<br><br></code></pre></td></tr></table></figure>
